name: Bug report
description: Something in Vestnil did not work
title: "[Bug] "
labels: [bug]
body:
  - type: input
    attributes: { label: Vestnil version, placeholder: 0.5.1 }
    validations: { required: true }
  - type: input
    attributes: { label: Windows version, placeholder: Windows 11 }
  - type: textarea
    attributes: { label: What did you do, and what happened? }
    validations: { required: true }
  - type: textarea
    attributes: { label: What did you expect? }
